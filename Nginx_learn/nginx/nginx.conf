events {}

http {

    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=my_cache:10m;

    upstream node_cluster {
        server api1:3000;
        server api2:3000;
    }

    # ============================
    # HTTP → Redirect sang HTTPS
    # ============================
    server {
        listen 80;
        server_name localhost;

        # Tự động chuyển hướng tất cả HTTP sang HTTPS
        return 301 https://$host$request_uri;
    }

    # ============================
    # HTTPS Server (SSL)
    # ============================
    server {
        listen 443 ssl;
        server_name localhost;

        # --- SSL Certificate ---
        ssl_certificate     /etc/nginx/ssl/server.crt;
        ssl_certificate_key /etc/nginx/ssl/server.key;

        # --- SSL Settings (bảo mật) ---
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # --- Redirect đường dẫn thiếu trailing slash ---
        location = /api {
            return 301 /api/;
        }

        location = /users {
            return 301 /users/;
        }

        location = /products {
            return 301 /products/;
        }

        # --- Route riêng ---
        location /users/ {
            proxy_pass http://api1:3000/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /products/ {
            proxy_pass http://api2:3000/api;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Load balancing ---
        location /api/ {
            proxy_cache my_cache;
            proxy_cache_valid 200 30s;

            proxy_pass http://node_cluster;

            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # --- Static files ---
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }
    }
}